# 千杯clash / Hako LightXtreme 专用；地区优先级不代表实测延迟。
# 2026-11-11: 171 节点 AnyTLS 版（标准 Clash Meta 可用）+ 211 走台湾
# 注意：标准 Clash Meta 不支持 lightxtreme，改用 anytls 直连；冷门地区可能连不上
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
hosts:
  'dns.alidns.com':
    - 223.5.5.5
    - 223.6.6.6
  'doh.pub':
    - 1.12.12.21
    - 120.53.53.53
  'cloudflare-dns.com':
    - 1.1.1.1
    - 1.0.0.1
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: false
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  nameserver-policy:
    +.cn:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
